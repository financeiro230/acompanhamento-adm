<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acompanhamento ADM</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=202611181037">
</head>
<body data-t="claro">

<!-- ================= LOGIN ================= -->
<div class="blobs"><i></i><i></i><i></i></div>
<div id="login" class="hidden">
  <div class="kb" id="loginKb"></div>
  <div class="veil"></div>
  <div class="center">
    <div class="ltag"><b></b>Acompanhamento ADM</div>
    <form class="loginbox" id="loginForm" autocomplete="on">
      <div class="mark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4M8 14h3M8 17h6"/></svg></div>
      <h1 id="lgHello">Bem-vindo de volta</h1>
      <p class="sub">Entre com seu usuário e senha.</p>
      <div class="fl"><input id="lgUser" placeholder=" " autocomplete="username" autocapitalize="none" spellcheck="false"><label for="lgUser">Usuário</label></div>
      <div class="fl"><input id="lgPass" type="password" placeholder=" " autocomplete="current-password"><label for="lgPass">Senha</label>
        <button class="eye" type="button" id="lgEye" title="Mostrar senha"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
      <div class="caps hidden" id="lgCaps">⇪ Caps Lock está ligado</div>
      <div class="lrow"><label><input type="checkbox" id="lgRemember" checked> Lembrar meu usuário</label><span title="O administrador pode criar uma nova senha para você">Esqueci a senha</span></div>
      <div class="err" id="lgErr"></div>
      <button class="go" id="lgBtn">Entrar <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      <div class="lfoot">Sessão protegida · sai sozinho após 30 min sem uso</div>
    </form>
  </div>
</div>

<div id="boot"><div class="spinner"></div></div>

<!-- ================= APP ================= -->
<div id="app" class="hidden">
  <header>
    <div class="brand">📋 <span>Acompanhamento ADM</span></div>
    <nav class="tabs" id="tabs">
      <button class="tab" data-view="agenda">📅 <span>Agenda</span></button>
      <button class="tab" data-view="kanban">📋 <span>Kanban</span></button>
      <button class="tab" data-view="parados" title="Demandas sem atualização há dias">⏳ <span>Parados</span> <b class="count" id="stCount">0</b></button>
      <button class="tab" data-view="finalizadas">✅ <span>Finalizadas</span> <b class="count" id="finCount">0</b></button>
      <button class="tab admin-only" data-view="equipe">👥 <span>Equipe</span></button>
    </nav>
    <div class="spacer"></div>
    <input class="search" id="search" placeholder="Buscar…">
    <select id="spaceSel" class="spacesel admin-only" title="Espaço que você está vendo"></select>
    <span class="saving" id="saving"></span>
    <button class="avatar" id="meBtn" title="Minha conta"></button>
  </header>
  <div id="spaceBanner" class="banner hidden"></div>

  <main>
    <section id="v-agenda" class="view"></section>
    <section id="v-kanban" class="view"></section>
    <section id="v-parados" class="view"></section>
    <section id="v-finalizadas" class="view"></section>
    <section id="v-equipe" class="view"></section>
  </main>
</div>

<div id="batch" class="hidden"></div>
<div id="modalRoot"></div>
<div id="toast" class="hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/core.js?v=202611181037"></script>
<script src="js/kanban.js?v=202611181037"></script>
<script src="js/agenda.js?v=202611181037"></script>
<script src="js/equipe.js?v=202611181037"></script>
<script src="js/google.js?v=202611181037"></script>
<script src="js/main.js?v=202611181037"></script>
</body>
</html>
